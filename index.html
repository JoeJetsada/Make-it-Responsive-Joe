<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse by Job Categories</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <section class="categories">
    <h2 class="categories__title">
      Browse by<br>
      <span class="categories__underline">Job</span> Categories
    </h2>

    <div class="categories__grid">

      <!-- Digital Marketing -->
      <a href="#" class="card">
        <span class="card__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 10v4a1 1 0 0 0 1 1h2l5 4V5L6 9H4a1 1 0 0 0-1 1z" fill="currentColor"/>
            <path d="M15 9a4 4 0 0 1 0 6"/>
            <path d="M18 6a8 8 0 0 1 0 12"/>
          </svg>
        </span>
        <span class="card__bottom">
          <span class="card__text">
            <span class="card__name">Digital Marketing</span>
            <span class="card__jobs">143 Jobs Opened</span>
          </span>
          <svg class="card__arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
        </span>
      </a>

      <!-- Art & Design -->
      <a href="#" class="card">
        <span class="card__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 19l7-7 3 3-7 7-3-3z" fill="currentColor"/>
            <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/>
            <path d="M2 2l7.6 7.6"/>
            <circle cx="11" cy="11" r="2"/>
          </svg>
        </span>
        <span class="card__bottom">
          <span class="card__text">
            <span class="card__name">Art &amp; Design</span>
            <span class="card__jobs">110 Jobs Opened</span>
          </span>
          <svg class="card__arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
        </span>
      </a>

      <!-- Accounting (active) -->
      <a href="#" class="card card--active">
        <span class="card__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2v20"/>
            <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
          </svg>
        </span>
        <span class="card__bottom">
          <span class="card__text">
            <span class="card__name">Accounting</span>
            <span class="card__jobs">158 Jobs Opened</span>
          </span>
          <svg class="card__arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
        </span>
      </a>

      <!-- Photography -->
      <a href="#" class="card">
        <span class="card__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" fill="currentColor"/>
            <circle cx="12" cy="13" r="4" stroke="#fff1e8"/>
          </svg>
        </span>
        <span class="card__bottom">
          <span class="card__text">
            <span class="card__name">Photography</span>
            <span class="card__jobs">95 Jobs Opened</span>
          </span>
          <svg class="card__arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
        </span>
      </a>

      <!-- Copy Writing -->
      <a href="#" class="card">
        <span class="card__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
            <path d="M18.5 2.5a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" fill="currentColor"/>
          </svg>
        </span>
        <span class="card__bottom">
          <span class="card__text">
            <span class="card__name">Copy Writing</span>
            <span class="card__jobs">113 Jobs Opened</span>
          </span>
          <svg class="card__arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
        </span>
      </a>

      <!-- Music -->
      <a href="#" class="card">
        <span class="card__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 18v-6a9 9 0 0 1 18 0v6"/>
            <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3z" fill="currentColor"/>
            <path d="M3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z" fill="currentColor"/>
          </svg>
        </span>
        <span class="card__bottom">
          <span class="card__text">
            <span class="card__name">Music</span>
            <span class="card__jobs">55 Jobs Opened</span>
          </span>
          <svg class="card__arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
        </span>
      </a>

      <!-- Human Resources -->
      <a href="#" class="card">
        <span class="card__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <circle cx="8.5" cy="4.5" r="2.3"/>
            <path d="M5.5 9h6l.6 6h-1.4l-.4 6H7.2l-.4-6H5z"/>
            <circle cx="17" cy="9.5" r="1.8"/>
            <path d="M14.8 12.5h4.4l.5 4h-1l-.3 4.5h-2.8l-.3-4.5h-1z"/>
          </svg>
        </span>
        <span class="card__bottom">
          <span class="card__text">
            <span class="card__name">Human Resources</span>
            <span class="card__jobs">25 Jobs Opened</span>
          </span>
          <svg class="card__arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
        </span>
      </a>

      <!-- Explore more -->
      <a href="#" class="card card--explore">
        <span class="explore__text">
          Explore<br>
          30 More<br>
          Categories
        </span>
        <svg class="card__arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
      </a>

    </div>
  </section>

</body>
</html>
